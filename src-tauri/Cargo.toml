[package]
name = "imatag"
version = "0.1.0"
description = "A file tag app"
authors = ["masamonoke"]
edition = "2021"

[lib]
name = "imatag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
once_cell = "1.20.2"
base64 = "0.13.0"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-cli = "2"
